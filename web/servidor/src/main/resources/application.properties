# Puerto donde se abre la app (usa PORT de Render, por defecto 8080)
server.port=${PORT:8080}

# Base de datos SQLite en UN archivo junto al programa.
# Si se borra mercado.db, el programa la crea de nuevo vacía.
spring.datasource.url=jdbc:sqlite:mercado.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate crea/actualiza las tablas solo a partir de las clases
# @Entity (Titulado, Empleador, Simulacion). Nadie escribe SQL.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No abrir el navegador automáticamente al arrancar
vaadin.launch-browser=false
